[project]
name = "claimpilot"
version = "2.0.0a0"
description = "ClaimPilot — conversational motor-claim intake with grounded policy answers and an explainable fraud-risk signal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3",
    "pypdf>=5.0,<6",
]

[project.optional-dependencies]
data = [
    "openml>=0.15,<1",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "kaggle>=1.6,<2",
]
rag = [
    "sentence-transformers>=3.0,<6",
    "torch>=2.2,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
]
llm = [
    "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
