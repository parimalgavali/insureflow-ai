name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@localhost:5432/claimpilot
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Cache embedding model and AKB download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/raw/gdv
          key: rag-${{ hashFiles('rag/embeddings.py', 'scripts/fetch_data.py') }}
      - name: Fetch AKB, ingest into pgvector, evaluate retrieval
        run: |
          uv run python scripts/fetch_data.py akb
          uv run python -m rag.ingest
          uv run python -m rag.eval --json rag-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval
          path: rag-eval.json
          if-no-files-found: ignore
